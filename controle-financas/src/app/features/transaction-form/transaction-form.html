<div class="max-w-lg mx-auto mt-6 p-5 shadow-lg rounded-lg bg-white">

  <h2 class="text-xl font-semibold mb-4">
    <span *ngIf="modo === 'novo'">Nova Transação</span>
    <span *ngIf="modo === 'detalhe'">Detalhe da Transação</span>
    <span *ngIf="modo === 'edicao'">Editar Transação</span>
  </h2>

  <div class="flex flex-col gap-4">

    <div class="flex flex-col gap-2">
      <label for="descricao" class="text-gray-700">Descrição</label>
      <input
        pInputText
        id="descricao"
        [(ngModel)]="transacaoForm.descricao"
        [disabled]="modo === 'detalhe'" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="valor" class="text-gray-700">Valor</label>
      <p-inputNumber
        inputId="valor"
        [(ngModel)]="transacaoForm.valor"
        mode="currency"
        currency="BRL"
        locale="pt-BR"
        [disabled]="modo === 'detalhe'">
      </p-inputNumber>
    </div>

    <div class="flex align-items-center gap-2">
      <p-checkbox
        [(ngModel)]="transacaoForm.ehReceita"
        [binary]="true"
        inputId="ehReceita"
        [disabled]="modo === 'detalhe'">
      </p-checkbox>
      <label for="ehReceita" class="text-gray-600">
        É uma receita?
      </label>
    </div>

  </div>

  <!-- BOTÕES -->
  <div class="flex justify-end gap-2 mt-6">

    <p-button
      label="Voltar"
      icon="pi pi-arrow-left"
      styleClass="p-button-text"
      (click)="voltar()">
    </p-button>

    <p-button
      *ngIf="modo !== 'detalhe'"
      label="Salvar"
      icon="pi pi-check"
      (click)="salvar()">
    </p-button>

  </div>

</div>
