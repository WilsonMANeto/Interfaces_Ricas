<p-card header="Transações" class="shadow-2">

  <!-- BOTÃO NOVA TRANSAÇÃO -->
  <div class="flex justify-content-end mb-3">
    <button
      pButton
      label="Nova Transação"
      icon="pi pi-plus"
      class="p-button-sm"
      (click)="novaTransacao()">
    </button>
  </div>

  <!-- TABELA -->
  <p-table
    [value]="transacoes"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th>Descrição</th>
        <th>Valor</th>
        <th style="width: 120px">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-t>
      <tr>
        <td>{{ t.descricao }}</td>

        <td
          [ngClass]="{
            'text-green-600': t.ehReceita,
            'text-red-600': !t.ehReceita
          }">
          {{ t.valor | currency:'BRL' }}
        </td>

        <td class="flex gap-2">
          <!-- EDITAR -->
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="editarTransacao(t)">
          </button>

          <!-- EXCLUIR -->
          <button
            pButton
            icon="pi pi-trash"
            class="p-button-text p-button-danger p-button-sm"
            (click)="excluirTransacao(t)">
          </button>
        </td>
      </tr>
    </ng-template>

    <!-- LISTA VAZIA -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center text-gray-500">
          Nenhuma transação cadastrada.
        </td>
      </tr>
    </ng-template>

  </p-table>

</p-card>
